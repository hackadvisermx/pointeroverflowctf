name: The House Always Misses

on:
  workflow_dispatch:
  push:
    paths:
      - '04-game-hacking/03-the-house-always-misses/**'

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6 \
            libstdc++6 \
            libx11-6 \
            libxext6 \
            libxrandr2 \
            libxrender1 \
            libxi6 \
            libgl1-mesa-glx \
            libasound2 \
            libpulse0 \
            xvfb
      
      - name: Prepare game files
        run: |
          cd 04-game-hacking/03-the-house-always-misses
          chmod +x game
          ls -la
      
      - name: Run game with xvfb
        run: |
          cd 04-game-hacking/03-the-house-always-misses
          # Run with virtual display
          xvfb-run -a -s "-screen 0 1024x768x24" timeout 120 ./game || true
      
      - name: Capture flag from output
        run: |
          # The flag should be in the output above
          echo "Check workflow logs for POCTF{...} flag"