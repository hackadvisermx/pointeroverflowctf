name: Test Game Args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6 libstdc++6 libx11-6 libxext6 libxrandr2 libxrender1 libxi6 libgl1 libasound2t64 libpulse0 xvfb
      - name: Test game help
        run: |
          cd 04-game-hacking/03-the-house-always-misses
          chmod +x game
          xvfb-run -a -s "-screen 0 1024x768x24" timeout 10 ./game --help || true
          xvfb-run -a -s "-screen 0 1024x768x24" timeout 10 ./game --version || true
          xvfb-run -a -s "-screen 0 1024x768x24" timeout 10 ./game -h || true
          xvfb-run -a -s "-screen 0 1024x768x24" timeout 10 ./game -v || true