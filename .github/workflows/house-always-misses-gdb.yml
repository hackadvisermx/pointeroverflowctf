name: The House Always Misses - Targeted Memory Search

on:
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6 \
            libstdc++6 \
            libx11-6 \
            libxext6 \
            libxrandr2 \
            libxrender1 \
            libxi6 \
            libgl1 \
            libasound2t64 \
            libpulse0 \
            xvfb \
            gdb \
            python3 \
            python3-pip \
            libcap2-bin
      
      - name: Configure ptrace
        run: |
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
      
      - name: Prepare game files
        run: |
          cd 04-game-hacking/03-the-house-always-misses
          chmod +x game
          ls -la
      
      - name: Create gdb Python script
        run: |
          echo "" | base64 -d > /tmp/gdb_search.py
      
      - name: Prepare game files
        run: |
          cd 04-game-hacking/03-the-house-always-misses
          chmod +x game
          ls -la
      
      - name: Run game and search memory with gdb
        run: |
          cd 04-game-hacking/03-the-house-always-misses
          
          sudo sysctl -w kernel.yama.ptrace_scope=0
          
          xvfb-run -a -s "-screen 0 1024x768x24" ./game &
          GAME_PID=$!
          
          sleep 8
          
          sudo gdb -p $GAME_PID -batch -ex "set pagination off" -ex "source /tmp/gdb_search.py" 2>&1 | tee /tmp/gdb_search_output.txt
          
          kill $GAME_PID 2>/dev/null || true
      
      - name: Show search results
        run: |
          cat /tmp/gdb_search_output.txt
      
      - name: Upload gdb output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdb-search-output
          path: /tmp/gdb_search_output.txt