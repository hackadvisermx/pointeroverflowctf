name: The House Always Misses - Symbol Analysis

on:
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6 \
            libstdc++6 \
            libx11-6 \
            libxext6 \
            libxrandr2 \
            libxrender1 \
            libxi6 \
            libgl1 \
            libasound2t64 \
            libpulse0 \
            xvfb \
            gdb \
            python3 \
            python3-pip \
            libcap2-bin
      
      - name: Configure ptrace
        run: |
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
      
      - name: Prepare game files
        run: |
          cd 04-game-hacking/03-the-house-always-misses
          chmod +x game
          ls -la
      
      - name: Create gdb analysis script
        run: |
          python3 -c "
import base64
script = b'''import gdb

print(\"=== The House Always Misses - Symbol Analysis ===\")

patterns = [
    \"CastRay\", \"intersects\", \"intersect_ray\", \"raycast\",
    \"RayCast\", \"hit\", \"Hit\", \"collide\", \"Collide\",
    \"intersect_ray\", \"intersect_ray_2d\", \"PhysicsServer2D\",
    \"PhysicsServer3D\", \"RayCast2D\", \"RayCast3D\", \"ShapeCast\",
    \"TestBody\", \"TestMotion\", \"JPH\", \"CastRay\", \"NarrowPhaseQuery\",
    \"RayCast\", \"CollisionCollector\", \"_process\", \"_physics_process\",
    \"hit\", \"Hit\", \"crosshair\", \"Crosshair\", \"target_base\",
    \"TargetBase\", \"civilian\", \"Civilian\", \"duck\", \"Duck\",
    \"flip_target\", \"FlipTarget\", \"popup_target\", \"PopupTarget\"
]

print(\"Searching for hit detection functions...\")

for pattern in patterns:
    try:
        result = gdb.execute(\"info functions \" + pattern, to_string=True)
        if result.strip() and \"No symbol\" not in result:
            print(\"\\nFound '\" + pattern + \"':\")
            print(result[:500])
    except gdb.error as e:
        pass

print(\"\\n=== Analysis complete ===\")
'''
with open('/tmp/analyze_symbols.py', 'wb') as f:
    f.write(script)
print('Script written to /tmp/analyze_symbols.py')
"
      
      - name: Prepare game files
        run: |
          cd 04-game-hacking/03-the-house-always-misses
          chmod +x game
          ls -la
      
      - name: Run game and analyze symbols
        run: |
          cd 04-game-hacking/03-the-house-always-misses
          
          sudo sysctl -w kernel.yama.ptrace_scope=0
          
          xvfb-run -a -s "-screen 0 1024x768x24" ./game &
          GAME_PID=$!
          
          sleep 12
          
          sudo gdb -p $GAME_PID -batch -ex "set pagination off" -ex "source /tmp/analyze_symbols.py" 2>&1 | tee /tmp/symbol_analysis.txt
          
          kill $GAME_PID 2>/dev/null || true
      
      - name: Show analysis results
        run: |
          cat /tmp/symbol_analysis.txt
      
      - name: Upload analysis output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symbol-analysis-output
          path: /tmp/symbol_analysis.txt