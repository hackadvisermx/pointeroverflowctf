  - generic [ref=e4]:
    - paragraph [ref=e5]: A shooting-gallery arcade cabinet sits behind the Hollis boardwalk, pulled from storage after fifteen years in a Marchetti warehouse. The game runs. The targets move. Your shots never land.
    - paragraph [ref=e6]: Three rooms. Each has moving targets you must clear. The game’s physics are deterministic and (as far as the cabinet is concerned) honest. What’s dishonest is what counts as a hit — the geometry the game checks when your bullet reaches a target. If accuracy is probability with better lies, you need to tell a different lie.
    - paragraph [ref=e7]: Download the game binary for your OS and the credentials bundle (game.token + team.key) from the challenge page. Place them in the same folder. Run the binary — it will authenticate against your credentials and drop you into the gallery.
