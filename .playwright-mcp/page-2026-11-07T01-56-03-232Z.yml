    - region [ref=e68]:
      - heading "About" [level=2] [ref=e69]
      - paragraph [ref=e70]:
        - text: "Welcome to the Pointer Overflow CTF! POCTF 2026 launches Sunday, September 27 at 09:00 CDT. Registration is open now — sign up individually or with a team, pick your bracket, and get ready. POCTF is designed for learners, newcomers, and anyone exploring the world of cybersecurity and CTFs. Whether this will be your first competition or your next milestone, this contest is built to be accessible, educational, and community-driven. The Pointer Overflow CTF is organized in honor of the students and alumni of the CIS: Cybersecurity program at the University of Wisconsin–Stevens Point. The contest continues to support our mission of expanding hands-on cybersecurity education through the"
        - link "Center for Cybersecurity Studies and Advanced Research" [ref=e71] [cursor=pointer]:
          - /url: https://www.uwsp.edu/smcpa/school-of-mathematics-computing-physics-and-astronomy/center-for-cybersecurity-studies-and-advanced-research/
        - text: . If you’re considering a career in cybersecurity, UW-Stevens Point offers both an
        - link "Undergraduate Cybersecurity" [ref=e72] [cursor=pointer]:
          - /url: https://www.uwsp.edu/programs/degree/computer-information-system/
        - text: option and a
        - link "Graduate Cybersecurity" [ref=e73] [cursor=pointer]:
          - /url: https://www.uwsp.edu/programs/degree/master-of-science-in-cybersecurity-2/
        - text: program through the UW Extended Campus collaborative degree. And if you’d like to support research, outreach, and student development, UWSP is now able to accept direct donations—every dollar goes toward expanding cybersecurity education and research on campus. Our
        - link "Discord community" [ref=e74] [cursor=pointer]:
          - /url: https://discord.com/invite/Hz6UvDtwSP
        - text: is the fastest place to get help, ask questions, and follow announcements before and during the contest.
        - link "RSVP to the POCTF 2026 event on our Discord." [ref=e75] [cursor=pointer]:
          - /url: https://discord.com/events/1050800926912413828/1428367676878884955
